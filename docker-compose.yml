services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      TRUTHLENS_MODE: DEMO
      TRUTHLENS_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  qdrant_data:
